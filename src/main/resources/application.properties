spring.application.name=${APP_NAME:Treinamento CRUD Spring Boot}
application.title=${spring.application.name}
application.version=${APP_VERSION:0.0.1-SNAPSHOT}
application.owner=${APP_OWNER:DETRAN-CE}
# Evita que a barra da arte escape os placeholders de cor no banner.
banner.backslash=\\

spring.datasource.url=jdbc:postgresql://localhost:5432/dbtreino?currentSchema=treino
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=treino
spring.jpa.open-in-view=false

# Flutter Web local: a porta pode variar a cada flutter run.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}

# Webhook de cadastros: desativado quando WEBHOOK_URL estiver vazio.
app.webhook.url=${WEBHOOK_URL:}
app.webhook.token=${WEBHOOK_TOKEN:}

# Swagger: documenta apenas as rotas REST.
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Console e arquivo rotativo usam o mesmo formato, incluindo o nome da aplicação.
logging.file.name=${LOG_FILE:logs/treinamento-crud-spring.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
logging.level.root=INFO
logging.level.br.gov.ce.detran.treinamento.spring=${APP_LOG_LEVEL:DEBUG}
# SQL pelo logger (show-sql imprime diretamente no console, sem identificação).
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
