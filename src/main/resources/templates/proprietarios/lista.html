<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proprietários</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css"><link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/consulta.js}" defer></script></head>
<body><header th:replace="~{fragments/header :: header}"></header><main class="page-shell">
<div class="page-header"><div><p class="eyebrow">Cadastros</p><h1 th:text="${tipoPessoa == 'PJ' ? 'Empresas' : tipoPessoa == 'PF' ? 'Pessoas físicas' : 'Proprietários'}">Proprietários</h1><p>Consulte e gerencie os proprietários cadastrados.</p></div><a class="btn btn-soft btn-neutral" th:href="@{/}">← Voltar ao início</a></div>
<div th:replace="~{fragments/mensagens :: mensagens}"></div>
<section class="card panel"><div class="card-body"><div class="section-toolbar"><h2 th:text="${tipoPessoa == 'PJ' ? 'Lista de empresas' : 'Lista de proprietários'}">Lista de proprietários</h2><a class="btn btn-soft btn-primary" th:href="@{/proprietarios/novo(tipoPessoa=${tipoPessoa ?: 'PF'})}" th:text="${tipoPessoa == 'PJ' ? 'Nova empresa' : 'Novo proprietário'}">Novo proprietário</a></div>
<form class="compact-filter-bar" method="get" th:action="@{/proprietarios}" data-live-filter><input type="hidden" name="tipoPessoa" th:value="${tipoPessoa}"><div class="field"><label for="campo">Campo de pesquisa</label><select class="select" id="campo" name="campo"><option value="nome" th:selected="${campo == 'nome'}">Nome</option><option value="cpfCnpj" th:selected="${campo == 'cpfCnpj'}">CPF/CNPJ</option><option value="cidade" th:selected="${campo == 'cidade'}">Cidade</option><option value="estado" th:selected="${campo == 'estado'}">Estado</option><option value="rua" th:selected="${campo == 'rua'}">Rua</option><option value="cep" th:selected="${campo == 'cep'}">CEP</option></select></div><div class="field filter-value"><label for="valor">Valor da pesquisa</label><input class="input" id="valor" name="valor" th:value="${valor}" maxlength="150" placeholder="Digite para pesquisar"></div><button class="btn btn-soft btn-success" type="submit">Filtrar</button><button class="btn" type="submit" th:formaction="@{/relatorio-proprietarios}">Exportar PDF</button><a class="btn btn-soft btn-neutral" th:href="@{/proprietarios(tipoPessoa=${tipoPessoa})}">Limpar</a></form><p id="busca-status" class="filter-status" aria-live="polite"></p>
<div id="proprietarios-resultados" th:attr="data-total=${pagina.totalElements}"><p class="empty-state" th:if="${pagina.empty}">Nenhum proprietário encontrado.</p><div class="table-wrap" th:unless="${pagina.empty}"><table class="table table-zebra data-table"><thead><tr><th th:text="${tipoPessoa == 'PJ' ? 'CNPJ' : 'CPF/CNPJ'}">CPF/CNPJ</th><th th:text="${tipoPessoa == 'PJ' ? 'Razão social' : 'Nome'}">Nome</th><th>Endereço</th><th>Ações</th></tr></thead><tbody><tr th:each="item : ${pagina.content}"><td th:text="${item.cpfCnpj}"></td><td th:text="${item.nome}"></td><td class="address-cell" th:text="|${item.rua ?: '—'}${item.numero != null ? ', ' + item.numero : ''} · ${item.cidade ?: ''} ${item.estado ?: ''}|"></td><td><div class="row-actions"><a class="btn btn-soft btn-success btn-sm" th:href="@{/proprietarios/{id}(id=${item.id})}">Visualizar</a><a class="btn btn-soft btn-warning btn-sm" th:href="@{/proprietarios/{id}/editar(id=${item.id})}">Editar</a><form method="post" th:action="@{/proprietarios/{id}/excluir(id=${item.id})}" onsubmit="return confirm('Excluir este proprietário?')"><button class="btn btn-error btn-sm" type="submit">Excluir</button></form></div></td></tr></tbody></table></div>
<nav class="pagination" th:if="${pagina.totalPages > 1}" aria-label="Páginas"><a class="btn btn-sm" th:classappend="${pagina.first} ? 'btn-disabled'" th:href="@{/proprietarios(page=${pagina.number - 1},campo=${campo},valor=${valor},tipoPessoa=${tipoPessoa})}">Anterior</a><span th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|">Página</span><a class="btn btn-sm" th:classappend="${pagina.last} ? 'btn-disabled'" th:href="@{/proprietarios(page=${pagina.number + 1},campo=${campo},valor=${valor},tipoPessoa=${tipoPessoa})}">Próximo</a></nav><p class="pagination-total" th:text="|Nesta página: ${pagina.numberOfElements} · Total: ${pagina.totalElements}|">Total</p></div></div></section></main></body></html>
