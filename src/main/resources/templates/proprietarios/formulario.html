<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de proprietário</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css"><link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/dados-ficticios.js}" defer></script></head><body><header th:replace="~{fragments/header :: header}"></header><main class="page-shell"><div class="page-header"><div><p class="eyebrow" th:text="${tipoPessoa == 'PJ' ? 'Empresas' : 'Proprietários'}"></p><h1 th:text="${edicao ? 'Editar proprietário' : tipoPessoa == 'PJ' ? 'Nova empresa' : 'Novo proprietário'}"></h1><p>Preencha os dados do proprietário.</p></div><a class="btn btn-soft btn-neutral" th:href="${origem == 'veiculo'} ? @{/veiculos/novo} : @{/proprietarios(tipoPessoa=${tipoPessoa})}">← Voltar</a></div><div th:replace="~{fragments/mensagens :: mensagens}"></div>
<section class="card panel form-card"><div class="card-body"><form method="post" th:action="${edicao} ? @{/proprietarios/{id}(id=${id})} : @{/proprietarios(tipoPessoa=${tipoPessoa})}" th:object="${proprietario}"><input type="hidden" name="tipoPessoa" th:value="${tipoPessoa}"><input type="hidden" name="origem" th:value="${origem}"><div class="form-actions"><button class="btn btn-soft btn-neutral" type="button" data-gerar-ficticios="proprietario">Gerar dados fictícios</button><span class="field-hint" data-aviso-ficticios role="status" aria-live="polite"></span></div><div class="form-grid"><div class="field"><label for="cpfCnpj">CPF/CNPJ</label><input class="input" id="cpfCnpj" th:field="*{cpfCnpj}" th:readonly="${edicao}" maxlength="18" required><small class="field-error" th:errors="*{cpfCnpj}"></small></div><div class="field"><label for="nome" th:text="${tipoPessoa == 'PJ' ? 'Razão social' : 'Nome'}"></label><input class="input" id="nome" th:field="*{nome}" maxlength="150" required><small class="field-error" th:errors="*{nome}"></small></div><div class="field"><label for="cep">CEP</label><input class="input" id="cep" th:field="*{cep}" maxlength="10"><small class="field-error" th:errors="*{cep}"></small></div><div class="field field-wide"><label for="rua">Rua</label><input class="input" id="rua" th:field="*{rua}" maxlength="150"></div><div class="field"><label for="numero">Número</label><input class="input" id="numero" th:field="*{numero}" maxlength="20"></div><div class="field"><label for="complemento">Complemento</label><input class="input" id="complemento" th:field="*{complemento}" maxlength="255"></div><div class="field"><label for="cidade">Cidade</label><input class="input" id="cidade" th:field="*{cidade}" maxlength="100"></div><div class="field"><label for="estado">Estado (UF)</label><input class="input" id="estado" th:field="*{estado}" maxlength="2"><small class="field-error" th:errors="*{estado}"></small></div></div><div class="form-actions"><button class="btn btn-soft btn-primary" type="submit">Salvar</button><a class="btn btn-soft btn-neutral" th:href="${origem == 'veiculo'} ? @{/veiculos/novo} : @{/proprietarios(tipoPessoa=${tipoPessoa})}">Cancelar</a></div></form></div></section></main></body></html>
