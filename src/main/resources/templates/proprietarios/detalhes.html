<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detalhes do proprietário</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="page-shell"><div class="page-header"><div><p class="eyebrow">Proprietários</p><h1 th:text="${proprietario.nome}">Proprietário</h1><p>Dados cadastrais do proprietário.</p></div><a class="btn btn-soft btn-neutral" th:href="@{/proprietarios(tipoPessoa=${#strings.length(proprietario.cpfCnpj) == 14 ? 'PJ' : 'PF'})}">← Voltar à lista</a></div><div th:replace="~{fragments/mensagens :: mensagens}"></div><section class="card panel"><div class="card-body"><dl class="details-grid"><div><dt>CPF/CNPJ</dt><dd th:text="${proprietario.cpfCnpj}"></dd></div><div><dt>Nome</dt><dd th:text="${proprietario.nome}"></dd></div><div><dt>CEP</dt><dd th:text="${proprietario.cep ?: '—'}"></dd></div><div><dt>Rua</dt><dd th:text="${proprietario.rua ?: '—'}"></dd></div><div><dt>Número</dt><dd th:text="${proprietario.numero ?: '—'}"></dd></div><div><dt>Complemento</dt><dd th:text="${proprietario.complemento ?: '—'}"></dd></div><div><dt>Cidade</dt><dd th:text="${proprietario.cidade ?: '—'}"></dd></div><div><dt>Estado</dt><dd th:text="${proprietario.estado ?: '—'}"></dd></div></dl><div class="form-actions"><a class="btn" th:href="@{/relatorio-proprietario(id=${proprietario.id})}">Exportar PDF</a><a class="btn" th:href="@{/relatorio-agrupado(idProprietario=${proprietario.id})}">Relatório com veículos</a><a class="btn btn-soft btn-success" th:href="@{/proprietarios/{id}/veiculos(id=${proprietario.id})}">Veículos do proprietário</a><a class="btn btn-soft btn-warning" th:href="@{/proprietarios/{id}/editar(id=${proprietario.id})}">Editar</a><form method="post" th:action="@{/proprietarios/{id}/excluir(id=${proprietario.id})}" onsubmit="return confirm('Excluir este proprietário?')"><button class="btn btn-error" type="submit">Excluir</button></form></div></div></section><section class="card panel"><div class="card-body"><h2 th:text="|Veículos de ${proprietario.nome} (${veiculos.totalElements})|"></h2>
<p th:if="${veiculos.empty}">Nenhum veículo ativo vinculado.</p>
<div th:each="item : ${veiculos.content}"><h3 th:text="|${item.tipo} · ${item.placa}|"></h3><p th:text="|Ano ${item.anoFabricacao} · RENAVAM ${item.renavam}|"></p><a class="btn" th:href="@{/veiculos/consultar-placa(placa=${item.placa})}">Consultar veículo</a></div>
<div class="form-actions"><a class="btn" th:href="@{/proprietarios/{id}/veiculos(id=${proprietario.id})}">Ver todos os veículos</a><a class="btn" th:href="@{/veiculos/novo(idProprietario=${proprietario.id})}">Novo veículo</a></div></div></section></main></body></html>
