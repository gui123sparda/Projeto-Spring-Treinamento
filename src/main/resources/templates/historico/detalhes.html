<!DOCTYPE html><html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico · Detalhes</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="page-shell"><div class="page-header"><h1>Histórico · Detalhes</h1><a class="btn btn-soft btn-neutral" th:href="@{/}">Voltar ao início</a></div><div th:replace="~{fragments/mensagens :: mensagens}"></div><section class="card panel"><div class="card-body"><dl><dt>ID</dt><dd th:text="${registro.id}"></dd><dt>Entidade</dt><dd th:text="${registro.entidade}"></dd><dt>Registro</dt><dd th:text="${registro.registroId}"></dd><dt>Operação</dt><dd th:text="${registro.operacao}"></dd><dt>Ocorrido em</dt><dd th:text="${registro.ocorridoEm}"></dd><dt>Usuário do banco</dt><dd th:text="${registro.usuarioBanco}"></dd></dl><h2>Antes</h2><p th:if="${registro.antes == null}">Sem dados.</p><div class="table-wrap"><table class="table"><tbody><tr th:each="campo : ${registro.antes}"><th th:text="${campo.key}"></th><td th:text="${campo.value}"></td></tr></tbody></table></div><h2>Depois</h2><p th:if="${registro.depois == null}">Sem dados.</p><div class="table-wrap"><table class="table"><tbody><tr th:each="campo : ${registro.depois}"><th th:text="${campo.key}"></th><td th:text="${campo.value}"></td></tr></tbody></table></div><a class="btn" th:href="@{/historico}">Voltar à lista</a></div></section></main></body></html>
