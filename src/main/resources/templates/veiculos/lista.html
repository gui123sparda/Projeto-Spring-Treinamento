<!DOCTYPE html><html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veículos</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="page-shell"><div class="page-header"><h1>Veículos</h1><a class="btn btn-soft btn-neutral" th:href="@{/}">Voltar ao início</a></div><div th:replace="~{fragments/mensagens :: mensagens}"></div><section class="card panel"><div class="card-body"><div class="section-toolbar"><h2>Lista de veículos</h2><div class="row-actions"><a class="btn btn-soft btn-success" th:href="@{/veiculos/consultar-placa}">Consultar placa</a><a class="btn btn-soft btn-primary" th:href="@{/veiculos/novo}">Novo veículo</a></div></div><form class="compact-filter-bar" method="get" th:action="@{/veiculos}">
<div class="field"><label for="campo">Campo de pesquisa</label><select class="select" id="campo" name="campo"><option th:each="op : ${ {'placa','tipo','renavam','chassi','anoFabricacao','proprietario'} }" th:value="${op}" th:text="${op == 'anoFabricacao' ? 'Ano de fabricação' : #strings.capitalize(op)}" th:selected="${campo == op}"></option></select></div>
<div class="field"><label for="valor">Valor da pesquisa</label><input class="input" id="valor" name="valor" th:value="${valor}" maxlength="150"></div>
<button class="btn" type="submit">Filtrar</button><button class="btn" type="submit" th:formaction="@{/relatorio-veiculos}">Exportar PDF</button><a class="btn" th:href="@{/veiculos}">Limpar</a></form><p th:if="${pagina.empty}">Nenhum veículo encontrado.</p><div class="table-wrap"><table class="table table-zebra"><thead><tr><th>Placa</th><th>Tipo</th><th>RENAVAM</th><th>Chassi</th><th>Ano</th><th>Proprietário</th><th>Ações</th></tr></thead><tbody><tr th:each="item : ${pagina.content}"><td th:text="${item.placa}"></td><td th:text="${item.tipo}"></td><td th:text="${item.renavam}"></td><td th:text="${item.chassi}"></td><td th:text="${item.anoFabricacao}"></td><td><a th:href="@{/proprietarios/{id}(id=${item.idProprietario})}" th:text="${nomesProprietarios[item.idProprietario]}"></a></td><td><a class="btn btn-sm" th:href="@{/veiculos/consultar-placa(placa=${item.placa})}">Consultar placa</a> <a class="btn btn-sm" th:href="@{/veiculos/{id}/editar(id=${item.id})}">Editar</a> <form class="inline-form" method="post" th:action="@{/veiculos/{id}/excluir(id=${item.id})}" onsubmit="return confirm('Excluir este veículo?')"><button class="btn btn-error btn-sm" type="submit">Excluir</button></form></td></tr></tbody></table></div><nav class="pagination" th:if="${pagina.totalPages > 1}" aria-label="Páginas"><a class="btn" th:if="${!pagina.first}" th:href="@{/veiculos(page=${pagina.number - 1},campo=${campo},valor=${valor})}">Anterior</a><span th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|"></span><a class="btn" th:if="${!pagina.last}" th:href="@{/veiculos(page=${pagina.number + 1},campo=${campo},valor=${valor})}">Próximo</a></nav><p th:text="|Total: ${pagina.totalElements}|"></p></div></section></main></body></html>
