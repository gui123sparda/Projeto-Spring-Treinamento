<!DOCTYPE html><html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta de placas</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css"><link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/consulta-placa.js}" defer></script></head><body><header th:replace="~{fragments/header :: header}"></header><main class="page-shell"><div class="page-header"><h1>Consulta de placas</h1><a class="btn btn-soft btn-neutral" th:href="@{/}">Voltar ao início</a></div><div th:replace="~{fragments/mensagens :: mensagens}"></div><section class="card panel form-card" th:if="${veiculo == null}"><div class="card-body"><form method="get" th:action="@{/veiculos/consultar-placa}"><div class="field"><label for="placa">Placa</label><div class="row-actions"><input class="input" id="placa" name="placa" th:value="${placaPesquisada}" placeholder="ABC1D23" pattern="[A-Za-z]{3}-?[0-9][A-Za-z0-9][0-9]{2}" required><button class="btn btn-soft btn-success" type="submit">Consultar</button></div><small>Formato: ABC1234 ou ABC1D23.</small></div></form></div></section>
<p class="alert alert-info" role="status" th:if="${aviso}" th:text="${aviso}"></p>
<section class="card panel consulta-resultado" th:if="${veiculo != null}"><div class="card-body"><h2 th:text="|Resultado: ${veiculo.placa}|"></h2><figure th:replace="~{fragments/placa :: placa(${veiculo})}"></figure><h3>Veículo</h3><dl class="details-grid"><div><dt>Placa</dt><dd th:text="${veiculo.placa}"></dd></div><div><dt>Tipo</dt><dd th:text="${veiculo.tipo}"></dd></div><div><dt>RENAVAM</dt><dd th:text="${veiculo.renavam}"></dd></div><div><dt>Chassi</dt><dd th:text="${veiculo.chassi}"></dd></div><div><dt>Ano de fabricação</dt><dd th:text="${veiculo.anoFabricacao}"></dd></div></dl><h3>Proprietário</h3><dl class="details-grid"><div><dt>Nome</dt><dd th:text="${proprietario.nome ?: '—'}"></dd></div><div><dt>CPF/CNPJ</dt><dd th:text="${proprietario.cpfCnpj ?: '—'}"></dd></div><div><dt>Rua</dt><dd th:text="${proprietario.rua ?: '—'}"></dd></div><div><dt>Número</dt><dd th:text="${proprietario.numero ?: '—'}"></dd></div><div><dt>Complemento</dt><dd th:text="${proprietario.complemento ?: '—'}"></dd></div><div><dt>Cidade</dt><dd th:text="${proprietario.cidade ?: '—'}"></dd></div><div><dt>Estado</dt><dd th:text="${proprietario.estado ?: '—'}"></dd></div><div><dt>CEP</dt><dd th:text="${proprietario.cep ?: '—'}"></dd></div></dl><div class="form-actions"><a class="btn" th:href="@{/relatorio-veiculo(id=${veiculo.id})}">Exportar PDF</a><a class="btn btn-soft btn-success" th:href="@{/proprietarios/{id}/veiculos(id=${proprietario.id})}">Veículos do proprietário</a><a class="btn btn-soft btn-warning" th:href="@{/veiculos/{id}/editar(id=${veiculo.id})}">Editar veículo</a><a class="btn btn-soft btn-success" th:href="@{/proprietarios/{id}(id=${proprietario.id})}">Ver proprietário</a><a class="btn" th:href="@{/veiculos/consultar-placa}">Nova consulta</a><a class="btn" th:href="@{/veiculos}">Voltar à lista</a></div></div></section></main></body></html>
