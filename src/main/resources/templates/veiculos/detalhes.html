<!DOCTYPE html><html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detalhes do veículo</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="page-shell"><div class="page-header"><h1>Detalhes do veículo</h1><a class="btn btn-soft btn-neutral" th:href="@{/}">Voltar ao início</a></div><div th:replace="~{fragments/mensagens :: mensagens}"></div><section class="card panel"><div class="card-body"><figure th:replace="~{fragments/placa :: placa(${veiculo})}"></figure><dl class="details-grid"><dt>Tipo</dt><dd th:text="${veiculo.tipo}"></dd><dt>Proprietário (ID)</dt><dd th:text="${veiculo.idProprietario}"></dd><dt>Ano de fabricação</dt><dd th:text="${veiculo.anoFabricacao}"></dd><dt>Chassi</dt><dd th:text="${veiculo.chassi}"></dd><dt>Renavam</dt><dd th:text="${veiculo.renavam}"></dd><dt>Placa</dt><dd th:text="${veiculo.placa}"></dd><dt>Proprietário</dt><dd><a th:href="@{/proprietarios/{id}(id=${proprietario.id})}" th:text="${proprietario.nome}"></a></dd></dl><div class="row-actions"><a class="btn" th:href="@{/relatorio-veiculo(id=${veiculo.id})}">Exportar PDF</a><a class="btn" th:href="@{/veiculos}">Voltar à lista</a><a class="btn btn-warning" th:href="@{/veiculos/{id}/editar(id=${veiculo.id})}">Editar</a><form method="post" th:action="@{/veiculos/{id}/excluir(id=${veiculo.id})}" onsubmit="return confirm('Excluir este veículo?')"><button class="btn btn-error">Excluir</button></form></div></div></section></main></body></html>
