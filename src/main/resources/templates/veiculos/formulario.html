<!DOCTYPE html><html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de veículo</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css"><link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/veiculo-formulario.js}" defer></script><script th:src="@{/js/consulta-placa.js}" defer></script><script th:src="@{/js/dados-ficticios.js}" defer></script></head><body><header th:replace="~{fragments/header :: header}"></header><main class="page-shell"><div class="page-header"><h1>Cadastro de veículo</h1><a class="btn btn-soft btn-neutral" th:href="@{/veiculos}">Voltar à lista</a></div><div th:replace="~{fragments/mensagens :: mensagens}"></div><section class="card panel"><div class="card-body"><h2 th:text="${edicao ? 'Editar veículo' : 'Novo veículo'}"></h2><form method="post" th:object="${veiculo}" th:action="${edicao} ? @{/veiculos/{id}(id=${id})} : @{/veiculos}"><div class="alert alert-error" th:if="${#fields.hasAnyErrors()}"><ul><li th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></li></ul></div><p class="field-hint">1. Selecione o proprietário. 2. Preencha os dados do veículo.</p>
<div class="field field-wide"><label for="idProprietario">Proprietário</label><select id="idProprietario" class="select" th:field="*{idProprietario}" required><option value="">Selecione</option><option th:each="p : ${proprietarios}" th:value="${p.id}" th:text="|${p.nome} — ${p.cpfCnpj}|"></option></select></div>
<div class="form-actions"><span class="field-hint">Não encontrou o proprietário?</span><a class="btn" th:href="@{/proprietarios/novo(origem='veiculo')}">Cadastrar proprietário</a></div>
<p class="alert alert-warning" th:if="${#lists.isEmpty(proprietarios)}">Cadastre um proprietário antes de salvar um veículo.</p>
<noscript>Ative o JavaScript para selecionar o proprietário e liberar os dados do veículo.</noscript>
<fieldset class="fieldset" id="dados-veiculo" th:hidden="${veiculo.idProprietario == null}" th:disabled="${veiculo.idProprietario == null}"><legend class="fieldset-legend">Dados do veículo</legend><div class="form-actions"><button class="btn btn-soft btn-neutral" type="button" data-gerar-ficticios="veiculo">Gerar dados fictícios</button><span class="field-hint" data-aviso-ficticios role="status" aria-live="polite"></span></div><div class="form-grid">
<div class="field"><label for="placa">Placa</label><input class="input" id="placa" th:field="*{placa}" type="text" maxlength="8" pattern="[A-Za-z]{3}-?[0-9][A-Za-z0-9][0-9]{2}" placeholder="ABC1D23" aria-describedby="placa-instrucao" required><small class="field-hint" id="placa-instrucao">Formato antigo ABC1234 ou Mercosul ABC1D23.</small></div>
<fieldset class="field vehicle-type-field"><legend>Tipo de veículo</legend><div class="radio-group"><label><input class="radio radio-primary" type="radio" th:field="*{tipo}" value="CARRO" required> Carro</label><label><input class="radio radio-primary" type="radio" th:field="*{tipo}" value="MOTO" required> Moto</label></div></fieldset><div class="field"><label for="anoFabricacao">Ano de fabricação</label><input class="input" id="anoFabricacao" th:field="*{anoFabricacao}" type="number" min="1" required></div><div class="field"><label for="chassi">Chassi</label><input class="input" id="chassi" th:field="*{chassi}" type="text" maxlength="17" required></div><div class="field"><label for="renavam">Renavam</label><input class="input" id="renavam" th:field="*{renavam}" type="text" maxlength="11" required></div></div><div class="row-actions"><button class="btn btn-primary" type="submit">Salvar</button><a class="btn" th:href="@{/veiculos}">Cancelar</a></div></fieldset></form></div></section></main></body></html>
