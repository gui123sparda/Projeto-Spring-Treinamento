<!DOCTYPE html><html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logs de proprietários</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="page-shell"><div class="page-header"><h1>Logs de proprietários</h1><a class="btn btn-soft btn-neutral" th:href="@{/}">Voltar ao início</a></div><div th:replace="~{fragments/mensagens :: mensagens}"></div><section class="card panel"><div class="card-body"><p>Registros de auditoria gerados automaticamente.</p><p th:if="${#lists.isEmpty(registros)}">Nenhum registro encontrado.</p><div class="table-wrap"><table class="table table-zebra"><thead><tr><th>ID</th><th>Proprietário (ID)</th><th>CPF/CNPJ</th><th>Criação</th><th>Alteração</th><th>Ações</th></tr></thead><tbody><tr th:each="item : ${registros}"><td th:text="${item.id}"></td><td th:text="${item.idProprietario}"></td><td th:text="${item.cpfCnpj}"></td><td th:text="${item.dataCriacao}"></td><td th:text="${item.dataAlteracao}"></td><td><a class="btn btn-sm" th:href="@{/log-proprietarios/{id}(id=${item.id})}">Visualizar</a></td></tr></tbody></table></div></div></section></main></body></html>
